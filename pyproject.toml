[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lightning-client"
version = "0.1.0"
requires-python = ">=3.9"
description = "Python HTTP client for LightningDB — a graph+vector database with Cypher, MVCC, and full-text search"
authors = [{ name = "Benoit Viganotti" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/BViganotti/LightningDB"
Repository = "https://github.com/BViganotti/LightningDB"

[tool.setuptools.packages.find]
where = ["python"]
